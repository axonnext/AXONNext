name: Publish pyaxon to PyPI

# Runs when you publish a GitHub Release whose tag begins `axonnext-v`. Builds
# CPython 3.10-3.13 wheels for Linux/macOS/Windows plus the source sdist, then
# uploads them to PyPI using Trusted Publishing (OIDC) -- no API token is
# stored anywhere.
#
# ONE-TIME SETUP (on pypi.org): Account -> Publishing -> add a "pending
# publisher" for project "axonnext", owner "axonnext", repo "AXONNext",
# workflow "publish-pyaxon.yml", environment "pypi".
#
# TAG PREFIX: this repository ships two independently versioned packages, so a
# release tag names the package it releases -- `axonnext-v1.0.1` here,
# `serde_axon-v1.1.0` for the crate. Without the guard below, both publishers
# woke for every release: publishing serde_axon 1.1.0 made this workflow
# rebuild axonnext at its unchanged 1.0.0 and fail, because PyPI will not
# accept a version it already holds. `workflow_dispatch` stays unguarded so a
# release can always be run by hand.
#
# For a token-only first release instead, you can delete the `wheels` job and
# publish just the sdist (users then compile from the checked-in C on install).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'axonnext-v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "pp* *_i686 *-musllinux*"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'axonnext-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/axonnext
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
