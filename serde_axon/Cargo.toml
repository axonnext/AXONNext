[package]
name = "serde_axon"
version = "1.0.0"
authors = ["Michael Lauzon <axonnext@gmail.com>"]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "AXON Next for Serde — text/Binary codecs, lossless CST, migration/LSP, and Schema."
repository = "https://github.com/axonnext/AXONNext"
keywords = ["axon", "serde", "serialization", "data-format", "no_std"]
categories = ["encoding", "no-std", "parser-implementations"]
readme = "README.md"

[features]
default = ["std"]
# The core parser, value model, Serializer and Deserializer are no_std + alloc.
# `std` adds std::error::Error impls and std-dependent conveniences. `alloc` is
# always required.
std = ["alloc", "serde/std"]
alloc = ["serde/alloc"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
# Full UAX #31 identifier classification (no_std); replaces the is_alphabetic
# approximation the Core name grammar previously used.
unicode-ident = "1.0"
# SHA-256 for content identifiers (CIDs) over canonical bytes (no_std).
sha2 = { version = "0.10", default-features = false }
# AXON's `tz-names` profile validates RFC 9557 zone/offset pairs against the
# IANA database.  Both crates retain the crate's `no_std + alloc` build.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
chrono-tz = { version = "0.10", default-features = false }
# ECMAScript/JCS shortest-roundtrip floating-point spelling (no_std).
ryu-js = "1.0.3"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.docs.rs]
all-features = true
